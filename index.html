<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f6f8">
    <title>CamelPlayer 下載統計</title>
    <style>
      :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #172033; background: #f5f6f8; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; }
      main { width: min(1080px, calc(100% - 32px)); margin: 0 auto; padding: 64px 0 48px; }
      .eyebrow { color: #58677f; font-size: 13px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
      h1 { margin: 10px 0 8px; font-size: clamp(30px, 6vw, 46px); letter-spacing: -.04em; }
      .intro { margin: 0; color: #667085; line-height: 1.6; }
      .summary { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin: 34px 0 18px; padding: 24px 28px; border: 1px solid #e4e8ef; border-radius: 16px; background: #fff; box-shadow: 0 8px 28px #1720330a; }
      .metrics { display: flex; flex-wrap: wrap; gap: 32px; }
      .summary-label { color: #667085; font-size: 14px; }
      .total { margin-top: 4px; font-size: clamp(36px, 8vw, 52px); font-weight: 750; letter-spacing: -.045em; font-variant-numeric: tabular-nums; }
      .metric { min-width: 120px; }
      .metric .total { font-size: clamp(28px, 5vw, 36px); }
      .refresh { border: 0; border-radius: 9px; padding: 11px 15px; background: #172033; color: white; font: inherit; font-weight: 650; cursor: pointer; }
      .refresh:hover { background: #34425a; }
      .refresh:disabled { opacity: .6; cursor: wait; }
      .table-wrap { overflow: hidden; border: 1px solid #e4e8ef; border-radius: 14px; background: white; }
      table { width: 100%; border-collapse: collapse; text-align: left; }
      th, td { padding: 16px 20px; }
      th { color: #667085; background: #fafbfc; font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
      tbody tr + tr { border-top: 1px solid #edf0f4; }
      td:not(:first-child), th:not(:first-child) { text-align: right; }
      td:not(:first-child) { font-variant-numeric: tabular-nums; font-weight: 650; }
      td a { color: #2357c6; text-decoration: none; }
      td a:hover { text-decoration: underline; }
      .status { min-height: 24px; margin-top: 14px; color: #667085; font-size: 13px; }
      .status.error { color: #b42318; }
      .empty { padding: 28px 20px; color: #667085; text-align: center; }
      @media (max-width: 680px) { main { padding-top: 40px; } .summary { align-items: start; flex-direction: column; } .metrics { gap: 20px; } .table-wrap { overflow-x: auto; } table { min-width: 620px; } th, td { padding: 14px 12px; } }
    </style>
  </head>
  <body>
    <main>
      <div class="eyebrow">Release downloads</div>
      <h1>CamelPlayer 下載統計</h1>
      <p class="intro">SHA256SUMS 下載量代表自動更新；新下載量以 ZIP 下載量扣除自動更新量計算。</p>

      <section class="summary" aria-label="總下載量">
        <div class="metrics">
          <div class="metric">
            <div class="summary-label">新下載總數</div>
            <div class="total" id="new-total">—</div>
          </div>
          <div class="metric">
            <div class="summary-label">自動更新總數</div>
            <div class="total" id="update-total">—</div>
          </div>
          <div class="metric">
            <div class="summary-label">ZIP 總下載量</div>
            <div class="total" id="zip-total">—</div>
          </div>
        </div>
        <button class="refresh" id="refresh" type="button">重新整理</button>
      </section>

      <div class="table-wrap">
        <table>
          <thead><tr><th scope="col">版本</th><th scope="col">ZIP 總下載</th><th scope="col">自動更新</th><th scope="col">新下載</th></tr></thead>
          <tbody id="releases"><tr><td class="empty" colspan="4">正在載入 Releases…</td></tr></tbody>
        </table>
      </div>
      <div class="status" id="status" role="status" aria-live="polite"></div>
    </main>
    <script>
      const numberFormat = new Intl.NumberFormat("zh-TW");

      async function fetchReleases() {
        const releases = [];
        for (let page = 1; ; page += 1) {
          let batch;
          let lastError;
          for (let attempt = 0; attempt < 3; attempt += 1) {
            try {
              const response = await fetch(`https://api.github.com/repos/pcjustin/CamelPlayer/releases?per_page=100&page=${page}`, {
                headers: { Accept: "application/vnd.github+json" },
                cache: "no-store"
              });
              if (!response.ok) throw new Error(`GitHub API 回應錯誤（${response.status}）`);
              batch = await response.json();
              break;
            } catch (error) {
              lastError = error;
              if (attempt < 2) await new Promise(resolve => setTimeout(resolve, 1000 * (attempt + 1)));
            }
          }
          if (!batch) throw lastError;
          releases.push(...batch);
          if (batch.length < 100) return releases;
        }
      }

      async function loadReleases() {
        const button = document.querySelector("#refresh");
        const tbody = document.querySelector("#releases");
        const status = document.querySelector("#status");
        button.disabled = true;
        status.className = "status";
        status.textContent = "正在更新資料…";
        tbody.innerHTML = '<tr><td class="empty" colspan="2">正在載入 Releases…</td></tr>';

        try {
          const releases = await fetchReleases();
          const versions = new Map();
          const zipPattern = /^CamelPlayer-(\d+\.\d+\.\d+)-win-x64\.zip$/;
          const sumsPattern = /^CamelPlayer-(\d+\.\d+\.\d+)-SHA256SUMS\.txt$/;
          for (const release of releases) {
            for (const asset of release.assets) {
              const zipMatch = asset.name.match(zipPattern);
              const sumsMatch = asset.name.match(sumsPattern);
              if (zipMatch) {
                const version = zipMatch[1];
                const counts = versions.get(version) || { zip: 0, sums: 0 };
                counts.zip += asset.download_count;
                versions.set(version, counts);
              } else if (sumsMatch) {
                const version = sumsMatch[1];
                const counts = versions.get(version) || { zip: 0, sums: 0 };
                counts.sums += asset.download_count;
                versions.set(version, counts);
              }
            }
          }
          const rows = [...versions].filter(([, counts]) => counts.zip > 0).map(([version, counts]) => {
            const automaticUpdates = version === "0.1.0" ? 0 : counts.sums;
            return { version, zipDownloads: counts.zip, automaticUpdates, newDownloads: counts.zip - automaticUpdates };
          }).sort((a, b) =>
            b.version.localeCompare(a.version, undefined, { numeric: true, sensitivity: "base" })
          );
          const totals = rows.reduce((sum, row) => ({
            zip: sum.zip + row.zipDownloads,
            updates: sum.updates + row.automaticUpdates,
            fresh: sum.fresh + row.newDownloads
          }), { zip: 0, updates: 0, fresh: 0 });
          document.querySelector("#new-total").textContent = numberFormat.format(totals.fresh);
          document.querySelector("#update-total").textContent = numberFormat.format(totals.updates);
          document.querySelector("#zip-total").textContent = numberFormat.format(totals.zip);
          tbody.innerHTML = rows.length
            ? rows.map(row => `<tr><td><a href="https://github.com/pcjustin/CamelPlayer/releases/tags/v${encodeURIComponent(row.version)}" target="_blank" rel="noopener noreferrer">v${row.version}</a></td><td>${numberFormat.format(row.zipDownloads)}</td><td>${numberFormat.format(row.automaticUpdates)}</td><td>${numberFormat.format(row.newDownloads)}</td></tr>`).join("")
            : '<tr><td class="empty" colspan="4">目前沒有符合檔名格式的檔案。</td></tr>';
          status.textContent = `最後更新：${new Intl.DateTimeFormat("zh-TW", { dateStyle: "medium", timeStyle: "short" }).format(new Date())} · 資料來自 GitHub Releases`;
        } catch (error) {
          document.querySelector("#new-total").textContent = "—";
          document.querySelector("#update-total").textContent = "—";
          document.querySelector("#zip-total").textContent = "—";
          tbody.innerHTML = '<tr><td class="empty" colspan="4">無法載入下載統計。</td></tr>';
          status.className = "status error";
          status.textContent = `${error.message}。請稍後重試。`;
        } finally {
          button.disabled = false;
        }
      }

      document.querySelector("#refresh").addEventListener("click", loadReleases);
      loadReleases();
    </script>
  </body>
</html>
